name: Security and quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-security-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify GitHub Pages and announcement tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0

      - name: Check JavaScript syntax
        run: node --check app.js && node --check site-config.js && node --check scripts/post-discord-announcement.mjs && node --check scripts/security-check.mjs

      - name: Run website and Discord tests
        run: node --test tests/static-site.test.mjs tests/discord-announcement.test.mjs

      - name: Run static security checks
        run: node scripts/security-check.mjs

      - name: Verify Chrome extension archives
        run: unzip -t repertoire64-chrome-web-store-1.0.0.zip && unzip -t repertoire64-chrome-web-store-1.4.0.zip
